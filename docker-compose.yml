# Full stack: PostgreSQL + Express API + nginx-served React app
#   docker compose up --build -d        -> http://localhost:8080
#   docker compose exec backend pnpm db:seed   (demo data, run once)
#
# Uses the bundled Postgres by default. To use Neon instead, put
# DATABASE_URL=postgresql://... in a .env file next to this one.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elms
      POSTGRES_PASSWORD: elms
      POSTGRES_DB: elms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elms -d elms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://elms:elms@db:5432/elms}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-docker-dev-access-secret-change-me}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-docker-dev-refresh-secret-change-me}
      REFRESH_TOKEN_EXPIRY: 7d
      # Served over plain http on localhost; set to true behind HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Requests arrive through nginx; trust it for the client IP (audit logs, rate limiting)
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/apps/backend/uploads
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
